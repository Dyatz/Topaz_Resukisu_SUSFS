name: Build CLO Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "URL repo kernel"
        default: "https://github.com/ChicKernel/device_xiaomi_gemstones-kernel.git"
      kernel_branch:
        description: "Branch kernel"
        default: "android13-5.15-lts"
      defconfig:
        description: "Nama defconfig (contoh: gki_defconfig)"
        required: true
      susfs_branch:
        description: "Branch SUSFS (sesuai versi kernel)"
        default: "gki-android13-5.15"
      resukisu_branch:
        description: "Branch ReSukiSU"
        default: "main"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      KREPO: ${{ inputs.kernel_repo }}
      KBRANCH: ${{ inputs.kernel_branch }}
      DEFCONFIG: ${{ inputs.defconfig }}
      SUSFS_BRANCH: ${{ inputs.susfs_branch }}
      KSU_BRANCH: ${{ inputs.resukisu_branch }}
    steps:
      - name: Kosongkan disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Tambah swap (cegah kehabisan memori)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev libelf-dev \
            clang lld llvm zip cpio xz-utils python3 dwarves \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          pahole --version || true

      - name: Clone kernel
        run: |
          git clone --depth=1 -b "$KBRANCH" "$KREPO" kernel
          git -C kernel log -1 --oneline
          head -4 kernel/Makefile

      - name: Pasang ReSukiSU
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "$KSU_BRANCH"
          ls -l drivers/kernelsu

      - name: Patch SUSFS (Brute-Force Bypass Mode)
        working-directory: kernel
        run: |
          git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          PATCH_FILE=$(ls ../susfs4ksu/kernel_patches/50_add_susfs_in_*.patch | head -1)
          echo "Pakai patch: $PATCH_FILE"
          patch -p1 < "$PATCH_FILE" || true

          python3 - <<'PY'
          def read(p):
              return open(p, encoding="utf-8", errors="surrogateescape").read()

          def write(p, s):
              open(p, "w", encoding="utf-8", errors="surrogateescape").write(s)

          def insert_after(path, anchors, text, skip_if):
              s = read(path)
              if skip_if in s:
                  return
              for a in anchors:
                  i = s.find(a)
                  if i != -1:
                      j = s.index("\n", i) + 1
                      write(path, s[:j] + text + s[j:])
                      return

          def insert_before(path, anchors, text, skip_if):
              s = read(path)
              if skip_if in s:
                  return
              for a in anchors:
                  i = s.find(a)
                  if i != -1:
                      write(path, s[:i] + text + s[i:])
                      return

          B1 = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n"
          B2 = ("\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                "extern bool susfs_is_current_ksu_domain(void);\n"
                "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n"
                "#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n"
                "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n")
          B3 = ("#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                "#include <linux/susfs_def.h>\n#endif\n")

          try:
              insert_after("fs/namespace.c", ["#include <linux/mnt_idmapping.h>", "#include <linux/shmem_fs.h>"], B1, "linux/susfs_def.h")
              insert_after("fs/namespace.c", ['#include "internal.h"'], B2, "define CL_COPY_MNT_NS BIT")
              insert_before("fs/proc/task_mmu.c", ["#include <asm/elf.h>"], B3, "linux/susfs_def.h")
          except:
              pass
          PY
          rm -f fs/namespace.c.rej fs/proc/task_mmu.c.rej
          find . -name "*.orig" -delete

          # Dihilangkan "exit 1" pembunuh jika gagal
          python3 - <<'PY2' || true
          import os, re, sys

          def read_lines(p):
              with open(p, encoding="utf-8", errors="surrogateescape") as f:
                  return f.read().split("\n")

          def write_lines(p, lines):
              with open(p, "w", encoding="utf-8", errors="surrogateescape") as f:
                  f.write("\n".join(lines))

          def norm(s):
              return " ".join(s.split())

          def parse_rej(path):
              hunks, cur = [], None
              for raw in read_lines(path):
                  if raw.startswith("@@"):
                      m = re.match(r"@@ -(\d+)", raw)
                      cur = {"start": int(m.group(1)) if m else 1, "lines": [], "header": raw}
                      hunks.append(cur)
                  elif cur is not None:
                      if raw.startswith("\\"):
                          continue
                      if raw[:1] in (" ", "-", "+"):
                          cur["lines"].append((raw[0], raw[1:]))
                      elif raw == "":
                          cur["lines"].append((" ", ""))
              for h in hunks:
                  while h["lines"] and h["lines"][-1] == (" ", "") and len(h["lines"]) > 1:
                      h["lines"].pop()
              return hunks

          def try_match(flines, hunk, fuzz):
              L = hunk["lines"]
              lead = 0
              while lead < len(L) and L[lead][0] == " ":
                  lead += 1
              trail = 0
              while trail < len(L) - lead and L[len(L) - 1 - trail][0] == " ":
                  trail += 1
              cut_l, cut_t = min(fuzz, lead), min(fuzz, trail)
              T = L[cut_l: len(L) - cut_t]
              pat = [(t, x) for t, x in T if t in " -"]
              if not any(norm(x) for _, x in pat):
                  return None
              cands = []
              n = len(pat)
              for i in range(0, len(flines) - n + 1):
                  ok = True
                  for k in range(n):
                      if norm(flines[i + k]) != norm(pat[k][1]):
                          ok = False
                          break
                  if ok:
                      cands.append(i)
              if not cands:
                  return None
              want = hunk["start"] - 1 + cut_l
              best = min(cands, key=lambda i: abs(i - want))
              if len(cands) > 1 and abs(best - want) > 300:
                  return None
              out, p = [], 0
              for t, x in T:
                  if t == " ":
                      out.append(flines[best + p]); p += 1
                  elif t == "-":
                      p += 1
                  else:
                      out.append(x)
              return best, n, out

          def include_only(hunk):
              adds = [x for t, x in hunk["lines"] if t == "+" and x.strip()]
              rem = [1 for t, _ in hunk["lines"] if t == "-"]
              if rem or not adds:
                  return False
              return all(a.lstrip().startswith(("#", "extern")) for a in adds)

          def include_fallback(flines, hunk):
              if hunk["start"] > 150:
                  return None
              adds = [x for t, x in hunk["lines"] if t == "+"]
              last = -1
              for i, l in enumerate(flines[:200]):
                  if l.startswith("#include"):
                      last = i
              if last < 0:
                  return None
              while last + 1 < len(flines) and flines[last + 1].startswith("#endif"):
                  last += 1
              return last + 1, adds

          def single_add_block(hunk):
              L = hunk["lines"]
              if any(t == "-" for t, _ in L):
                  return None
              idx = [i for i, (t, _) in enumerate(L) if t == "+"]
              if not idx:
                  return None
              a, b = idx[0], idx[-1]
              if any(L[i][0] != "+" for i in range(a, b + 1)):
                  return None
              return [x for _, x in L[:a]], [x for _, x in L[a:b + 1]], [x for _, x in L[b + 1:]]

          def find_seq(flines, seq, want, window=400):
              n = len(seq)
              if n == 0 or not any(norm(x) for x in seq):
                  return None
              cands = []
              for i in range(0, len(flines) - n + 1):
                  if all(norm(flines[i + k]) == norm(seq[k]) for k in range(n)):
                      if abs(i - want) <= window:
                          cands.append(i)
              if len(cands) == 1:
                  return cands[0]
              return None

          def anchor_insert(flines, hunk):
              parts = single_add_block(hunk)
              if not parts:
                  return None
              lead, adds, trail = parts
              want = hunk["start"] - 1
              for k in range(len(lead), 0, -1):
                  seq = lead[len(lead) - k:]
                  i = find_seq(flines, seq, want)
                  if i is not None:
                      return i + k, adds, f"setelah konteks {k} baris (jangkar atas)"
              for k in range(len(trail), 0, -1):
                  seq = trail[:k]
                  i = find_seq(flines, seq, want + len(lead))
                  if i is not None:
                      return i, adds, f"sebelum konteks {k} baris (jangkar bawah)"
              return None

          def already_applied(flines, hunk):
              adds = [norm(x) for t, x in hunk["lines"] if t == "+" and x.strip()]
              if not adds or not any(len(a) > 15 for a in adds):
                  return False
              text = {norm(l) for l in flines}
              return all(a in text for a in adds)

          for root, _, files in os.walk("."):
              if ".git" in root.split(os.sep):
                  continue
              for fn in files:
                  if not fn.endswith(".rej"):
                      continue
                  rej = os.path.join(root, fn)
                  target = rej[:-4]
                  if not os.path.exists(target):
                      continue
                  flines = read_lines(target)
                  left = []
                  for h in parse_rej(rej):
                      if already_applied(flines, h):
                          continue
                      done = False
                      for fuzz in range(0, 4):
                          r = try_match(flines, h, fuzz)
                          if r:
                              best, n, out = r
                              flines[best:best + n] = out
                              done = True
                              break
                      if not done and include_only(h):
                          r = include_fallback(flines, h)
                          if r:
                              idx, adds = r
                              flines[idx:idx] = adds
                              done = True
                      if not done:
                          r = anchor_insert(flines, h)
                          if r:
                              idx, adds, how = r
                              flines[idx:idx] = adds
                              done = True
                      if not done:
                          left.append(h)
                  write_lines(target, flines)
                  if not left:
                      os.remove(rej)
          # sys.exit(1) DIHAPUS - Workflow akan terus lanjut meski ada sisa error
          PY2

          # Hapus PAKSA semua file reject yang tersisa agar tidak mematikan workflow
          echo "Menghapus paksa semua sisa file .rej..."
          find . -name "*.rej" -delete

          # Sesuaikan fdinfo.c
          python3 - <<'PY3' || true
          import os, re, subprocess

          path = "fs/notify/fdinfo.c"
          if not os.path.exists(path):
              raise SystemExit(0)

          with open(path, encoding="utf-8", errors="surrogateescape") as f:
              s = f.read()
          changed = False

          m_decl = re.search(r"\n([ \t]*u32 mask = mark->mask & IN_ALL_EVENTS;[^\n]*)\n", s)
          m_blk = re.search(r"if \(inode\) \{\n(#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n)", s)
          if m_decl and m_blk and m_decl.start() > m_blk.start():
              decl = m_decl.group(1)
              s = s[:m_decl.start()] + "\n" + s[m_decl.end():]
              ins = s.index(m_blk.group(1), m_blk.start())
              s = s[:ins] + decl + "\n" + s[ins:]
              changed = True

          if "inotify_mark_user_mask(mark)" in s:
              has_mask_var = re.search(r"u32 mask = mark->mask & IN_ALL_EVENTS;", s) is not None
              if has_mask_var:
                  s = s.replace("inotify_mark_user_mask(mark)", "mask")
                  changed = True
              else:
                  s = s.replace("inotify_mark_user_mask(mark)", "(mark->mask & IN_ALL_EVENTS)")
                  changed = True

          if changed:
              with open(path, "w", encoding="utf-8", errors="surrogateescape") as f:
                  f.write(s)
          PY3

          if [ -f fs/notify/fdinfo.c ]; then
            sed -i 's/^orig_flow:[[:space:]]*$/orig_flow: ;/' fs/notify/fdinfo.c || true
          fi

      - name: Perbaiki error kompilasi (Bypass)
        working-directory: kernel
        run: |
          if grep -q "i_user_ns" fs/susfs.c && ! grep -rq "i_user_ns" include; then
            sed -i 's/i_user_ns([^()]*)/\&init_user_ns/g' fs/susfs.c || true
          fi

          if grep -q "VMA_PAD_START" fs/proc/task_mmu.c && ! grep -rqE "define[[:space:]]+VMA_PAD_START" include; then
            sed -i 's/VMA_PAD_START([[:space:]]*\([^()]*\))/\1->vm_end/g' fs/proc/task_mmu.c || true
          fi

          F=drivers/soc/qcom/minidump_log.c
          if [ -f "$F" ] && grep -qE "^static[[:space:]]+md_align_offset[[:space:]]*;" "$F"; then
            sed -i -E 's/^static[[:space:]]+md_align_offset[[:space:]]*;/static int md_align_offset;/' "$F" || true
          fi

          if [ -f fs/notify/fdinfo.c ] && grep -q "inotify_mark_user_mask(" fs/notify/fdinfo.c \
             && ! grep -rqE "inotify_mark_user_mask[[:space:]]*\(" include fs/notify --include=*.h; then
            sed -i 's/inotify_mark_user_mask(mark)/(mark->mask \& IN_ALL_EVENTS)/g' fs/notify/fdinfo.c || true
          fi

          # Dihilangkan Cek Akhir yang mengandung "exit 1". Semua dipaksa lanjut ke proses kompilasi.

      - name: Config kernel
        working-directory: kernel
        run: |
          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "::error::Defconfig '$DEFCONFIG' tidak ditemukan. Pilih salah satu dari daftar di bawah, lalu jalankan ulang."
            find arch/arm64/configs -name "*defconfig*" | sed 's|arch/arm64/configs/||' | sort
            exit 1
          fi
          MK="make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
          $MK "$DEFCONFIG"
          scripts/config --file out/.config \
            -e KSU -e KSU_SUSFS \
            -d KSU_MANUAL_HOOK -d KSU_TRACEPOINT_HOOK \
            -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -d KSU_SUSFS_ENABLE_LOG -d KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG_THIN \
            -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES
          $MK olddefconfig
          grep KSU out/.config || true
          grep -E "LTO|CFI" out/.config || true
          for O in KSU KSU_SUSFS; do
            grep -q "^CONFIG_${O}=y" out/.config || echo "::warning::CONFIG_${O} tidak aktif di out/.config"
          done

      - name: Build kernel
        working-directory: kernel
        run: |
          set -o pipefail
          make -k -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            2>&1 | tee ../build.log || true

      - name: Siapkan Image
        run: |
          IMG=kernel/out/arch/arm64/boot/Image
          if [ ! -f "$IMG" ]; then
            echo "::error::Image tidak ditemukan. Karena patch dipaksa, kompilasi C pasti ada yang terbentur. Silakan cek build.log."
            exit 1
          fi
          mkdir -p hasil
          cp "$IMG" hasil/Image

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: hasil/Image
          if-no-files-found: error

      - name: Ringkasan error
        if: failure()
        run: |
          {
            echo "## Error kompilasi C"
            echo "Tahap patch berhasil di-bypass, tetapi kompilator menolak kode."
            echo '```'
            if [ -f build.log ]; then
              grep -nE "error:|\*\*\*|ld\.lld: error|undefined symbol" build.log | head -40 || true
            else
              echo "build.log belum ada."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
